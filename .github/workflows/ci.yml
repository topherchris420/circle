name: CIRCLE CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  fast-ci:
    name: Fast Software, Contracts & Deterministic Generation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit & property test suite
        run: python -m unittest discover -s tests

      - name: Validate hardware design manifest
        run: python tools/check_design_manifest.py

      - name: Validate session record schema
        run: python tools/check_record_schema.py

      - name: Validate resonance contracts & physics
        run: python tools/check_resonance_contract.py

      - name: Validate emergence contracts & physics
        run: python tools/check_emergence_contract.py

      - name: Validate quantum PNT contracts & physics
        run: python tools/check_pnt_contract.py

      - name: Closed-loop physiology twin, ground-truth scorecard & independent audit
        run: python tools/run_physiology_twin.py --output outputs/physiology --audit

      - name: Verify diagrams rendering
        run: python tools/render_diagrams.py

      - name: Generate schematic packages
        run: |
          python tools/generate_schematics.py
          python tools/generate_schematics.py --board circle-ppg

      - name: Verify ERC allowlist gate
        run: python tools/check_erc.py

      - name: Verify DRC allowlist gate
        run: python tools/check_drc.py

      - name: Assert deterministic artifact generation (zero drift)
        run: git diff --exit-code diagrams/ hardware/circle-main/legacy/ hardware/circle-ppg/legacy/ hardware/reports/

  hardware-ci:
    name: Hardware Verification (Fresh KiCad ERC & PCB DRC)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and gate fresh reports with pinned KiCad 10.0.5
        run: |
          docker run --rm --user root -v "${{ github.workspace }}:/workspace" -w /workspace \
            kicad/kicad:10.0.5@sha256:182c8005cb775a2c448a4c18681d489f1ff472a761885eba3e08b07e3c0564de \
            python3 tools/run_kicad_checks.py
