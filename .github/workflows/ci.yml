name: CIRCLE CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  fast-ci:
    name: Fast Software, Contracts & Deterministic Generation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit & property test suite
        run: python -m unittest discover -s tests

      - name: Validate hardware design manifest
        run: python tools/check_design_manifest.py

      - name: Validate session record schema
        run: python tools/check_record_schema.py

      - name: Validate resonance contracts & physics
        run: python tools/check_resonance_contract.py

      - name: Verify diagrams rendering
        run: python tools/render_diagrams.py

      - name: Generate schematic packages
        run: |
          python tools/generate_schematics.py
          python tools/generate_schematics.py --board circle-ppg

      - name: Verify ERC allowlist gate
        run: python tools/check_erc.py

      - name: Verify DRC allowlist gate
        run: python tools/check_drc.py

      - name: Assert deterministic artifact generation (zero drift)
        run: git diff --exit-code diagrams/ hardware/circle-main/legacy/ hardware/circle-ppg/legacy/ hardware/reports/

  hardware-ci:
    name: Hardware Verification (Fresh KiCad ERC & PCB DRC)
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:8.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        run: |
          apt-get update && apt-get install -y python3 python3-pip git
          python3 --version

      - name: Generate fresh schematic ERC reports
        run: |
          kicad-cli sch erc --format json --severity-all --output hardware/reports/circle-main-erc.json hardware/circle-main/legacy/00_root.sch
          kicad-cli sch erc --format json --severity-all --output hardware/reports/circle-ppg-erc.json hardware/circle-ppg/legacy/00_ppg_root.sch

      - name: Gate fresh ERC reports against allowlist
        run: python3 tools/check_erc.py

      - name: Generate fresh PCB DRC reports
        run: |
          kicad-cli pcb drc --format json --severity-all --output hardware/reports/circle-main-drc.json hardware/circle-main/circle-main.kicad_pcb
          kicad-cli pcb drc --format json --severity-all --output hardware/reports/circle-ppg-drc.json hardware/circle-ppg/circle-ppg.kicad_pcb

      - name: Gate fresh DRC reports against allowlist
        run: python3 tools/check_drc.py

      - name: Assert zero report drift from committed baselines
        run: git diff --exit-code hardware/reports/
