name: CIRCLE CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  fast-ci:
    name: Fast Software, Contracts & Deterministic Generation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit & property test suite
        run: python -m unittest discover -s tests

      - name: Validate hardware design manifest
        run: python tools/check_design_manifest.py

      - name: Validate session record schema
        run: python tools/check_record_schema.py

      - name: Validate resonance contracts & physics
        run: python tools/check_resonance_contract.py

      - name: Validate emergence contracts & physics
        run: python tools/check_emergence_contract.py

      - name: Verify diagrams rendering
        run: python tools/render_diagrams.py

      - name: Generate schematic packages
        run: |
          python tools/generate_schematics.py
          python tools/generate_schematics.py --board circle-ppg

      - name: Verify ERC allowlist gate
        run: python tools/check_erc.py

      - name: Verify DRC allowlist gate
        run: python tools/check_drc.py

      - name: Assert deterministic artifact generation (zero drift)
        run: git diff --exit-code diagrams/ hardware/circle-main/legacy/ hardware/circle-ppg/legacy/ hardware/reports/

  hardware-ci:
    name: Hardware Verification (Fresh KiCad ERC & PCB DRC)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate fresh schematic ERC reports via KiCad CLI
        run: |
          docker run --rm --user root -v ${{ github.workspace }}:/workspace -w /workspace kicad/kicad:8.0 sh -c "
            kicad-cli sch erc --format json --severity-all --output hardware/reports/circle-main-erc.json hardware/circle-main/legacy/00_root.sch || true
            kicad-cli sch erc --format json --severity-all --output hardware/reports/circle-ppg-erc.json hardware/circle-ppg/legacy/00_ppg_root.sch || true
          "

      - name: Gate fresh ERC reports against allowlist
        run: python tools/check_erc.py

      - name: Generate fresh PCB DRC reports via KiCad CLI
        run: |
          docker run --rm --user root -v ${{ github.workspace }}:/workspace -w /workspace kicad/kicad:8.0 sh -c "
            kicad-cli pcb drc --format json --severity-all --output hardware/reports/circle-main-drc.json hardware/circle-main/circle-main.kicad_pcb || true
            kicad-cli pcb drc --format json --severity-all --output hardware/reports/circle-ppg-drc.json hardware/circle-ppg/circle-ppg.kicad_pcb || true
          "

      - name: Gate fresh DRC reports against allowlist
        run: python tools/check_drc.py
