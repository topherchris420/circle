name: Demo (GitHub Pages)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build the offline demo
        run: python tools/build_demo.py --output demo
      - name: Publish to the gh-pages branch
        run: |
          cd demo
          git init -b gh-pages .
          git config user.name "circle-demo-ci"
          git config user.email "circle-demo-ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Offline demo build from $GITHUB_SHA"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
